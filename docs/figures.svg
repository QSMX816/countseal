<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="ui-monospace, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="440" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">CountSeal — billable but unreadable</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" fill="#64748b">content decryption right (user) ⊥ metering verification right (provider signature)</text>

  <!-- user box -->
  <rect x="30" y="100" width="200" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">User</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#334155">sk_u / pk_u (X25519)</text>
  <text x="130" y="172" text-anchor="middle" font-size="11" fill="#334155">nonce_q</text>
  <text x="130" y="196" text-anchor="middle" font-size="11" fill="#059669">decrypts response</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#059669">checks h_R</text>
  <text x="130" y="236" text-anchor="middle" font-size="11" fill="#64748b">sees: prompt + response</text>

  <!-- relay box -->
  <rect x="340" y="100" width="200" height="150" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="440" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#a16207">Relay</text>
  <text x="440" y="152" text-anchor="middle" font-size="11" fill="#334155">pk_p (pinned)</text>
  <text x="440" y="172" text-anchor="middle" font-size="11" fill="#334155">replay cache, clock</text>
  <text x="440" y="196" text-anchor="middle" font-size="11" fill="#b91c1c">no private key</text>
  <text x="440" y="214" text-anchor="middle" font-size="11" fill="#b91c1c">cannot read content</text>
  <text x="440" y="236" text-anchor="middle" font-size="11" fill="#64748b">sees: meter + attestation</text>

  <!-- provider box -->
  <rect x="650" y="100" width="200" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="750" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Provider</text>
  <text x="750" y="152" text-anchor="middle" font-size="11" fill="#334155">sk_p (Ed25519)</text>
  <text x="750" y="172" text-anchor="middle" font-size="11" fill="#334155">sk_pr (X25519)</text>
  <text x="750" y="196" text-anchor="middle" font-size="11" fill="#059669">seals content to pk_u</text>
  <text x="750" y="214" text-anchor="middle" font-size="11" fill="#059669">signs meter attestation</text>
  <text x="750" y="236" text-anchor="middle" font-size="11" fill="#64748b">sees: prompt + response</text>

  <!-- request path -->
  <line x1="230" y1="130" x2="338" y2="130" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="284" y="120" text-anchor="middle" font-size="10" fill="#334155">sealed_prompt, pk_u, nonce_q</text>
  <line x1="540" y1="130" x2="648" y2="130" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="594" y="120" text-anchor="middle" font-size="10" fill="#334155">forward (still sealed)</text>

  <!-- response path -->
  <line x1="648" y1="210" x2="542" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="594" y="230" text-anchor="middle" font-size="10" fill="#334155">(C, K, meter, π)</text>
  <line x1="338" y1="210" x2="232" y2="210" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="284" y="230" text-anchor="middle" font-size="10" fill="#334155">verified &amp; billed by n</text>

  <!-- meter attestation structure -->
  <rect x="230" y="292" width="420" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="440" y="314" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">meter = { model_id, n, h_R, h_C, h_K, nonce_q, ts }</text>
  <text x="440" y="336" text-anchor="middle" font-size="11" fill="#334155">π = Ed25519.Sign(sk_p, canonical(meter))</text>
  <line x1="440" y1="250" x2="440" y2="290" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <text x="470" y="276" font-size="10" fill="#059669">bills n, never opens content</text>
</svg>
